<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime World - Interactive Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Anime World - Interactive Gallery</h1>

    <h3>Click on an image to view it in a larger size</h3>

    <div class="gallery">

        <div class="gallery-item">
            <img src="images/image1.jpg" alt="Naruto">
            <h3>Naruto</h3>
        </div>

        <div class="gallery-item">
            <img src="images/image2.jpg" alt="One Piece">
            <h3>One Piece</h3>
        </div>

        <div class="gallery-item">
            <img src="images/image3.jpg" alt="Demon Slayer">
            <h3>Demon Slayer</h3>
        </div>

        <div class="gallery-item">
            <img src="images/image4.jpg" alt="Jujutsu Kaisen">
            <h3>Jujutsu Kaisen</h3>
        </div>

        <div class="gallery-item">
            <img src="images/image5.jpg" alt="Attack on Titan">
            <h3>Attack on Titan</h3>
        </div>

        <div class="gallery-item">
            <img src="images/image6.jpg" alt="My Hero Academia">
            <h3>My Hero Academia</h3>
        </div>

        <div class="gallery-item">
            <img src="images/image7.jpg" alt="Solo Leveling">
            <h3>Solo Leveling</h3>
        </div>

        <div class="gallery-item">
            <img src="images/image8.jpg" alt="That Time I Got Reincarnated as a Slime">
            <h3>That Time I Got Reincarnated as a Slime</h3>
        </div>

    </div>

    <div id="lightbox" class="lightbox">

        <span id="close">&times;</span>

        <img id="lightbox-img" src="" alt="Large Anime Image">

    </div>

    <script src="script.js"></script>

</body>

</html>
